# Railway deployment config for MatchCast AI backend.
# Railway will autodetect the Dockerfile and build accordingly.

[build]
# Use the Dockerfile at the repo root
dockerfilePath = "Dockerfile"

[deploy]
# Health check endpoint
healthcheckPath = "/health"
healthcheckTimeout = 300
# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
# Configure these in Railway's environment variables dashboard.
# GENBLAZE_API_KEY = ""
# GMI_CLOUD_API_KEY = ""
# B2_APPLICATION_KEY_ID = ""
# B2_APPLICATION_KEY = ""
B2_BUCKET_NAME = "matchcast-assets"
# Set these after deploying your Vercel frontend:
# FRONTEND_URL = "https://matchcast-ai.vercel.app"
# CORS_ORIGINS = "https://matchcast-ai.vercel.app"
